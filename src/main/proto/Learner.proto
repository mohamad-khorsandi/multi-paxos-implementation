syntax = "proto3";
option java_multiple_files = true;
option java_package = "org.example";

service LearnerService {
  rpc InternalLearn(InternalLearnRequest) returns (InternalLearnResponse) {}
}

message InternalLearnRequest {
  int32 sequence_number = 1;
  string accepted_value = 2;
  int32 replica_number = 3;
}

message InternalLearnResponse {
}